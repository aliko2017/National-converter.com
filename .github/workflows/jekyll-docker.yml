name: National id 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the Nationalid
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/nationalid/_site \
        Nationalid/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
